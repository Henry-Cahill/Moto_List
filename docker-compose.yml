services:
  api:
    build:
      context: .
      dockerfile: src/Moto_List.API/Dockerfile
    container_name: motolist-api
    ports:
      - "7101:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=MotoListDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      - Jwt__Key=ThisIsA32CharacterLongSecretKey!!
      - Jwt__Issuer=MotoListAPI
      - Jwt__Audience=MotoListWeb
      - Jwt__ExpiresInMinutes=60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Moto_List.Web/Dockerfile
    container_name: motolist-web
    ports:
      - "7201:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiBaseUrl=http://api:8080
    depends_on:
      - api
    restart: unless-stopped
